{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />

    <!-- HTMX SCRIPT  -->
    <script src="https://unpkg.com/htmx.org@1.9.4"></script>

    <!-- Google Icons  -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <!-- bootstrap-icons  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Poppins  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- AOS animation  -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Main css  -->
    <!-- <link rel="stylesheet" href="{% static '/css/main.css' %}" /> -->

    <!-- changed  -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />

    <!-- Favicon  -->
    <link
      rel="icon"
      type="image/x-icon"
      href="{% static '/images/favicon.ico' %}"
    />

    <style>
      .hero_container {
        width: 100%; /* Adjust width as needed */
        padding-top: 150px;
        padding-bottom: 150px;
        min-height: 90vh;
        background:
          linear-gradient(
            to top right,
            rgba(245, 91, 20, 0.994),
            /* darker bottom-left */ rgba(245, 91, 20, 0)
              /* lighter top-right (image visible) */
          ),
          url('{% static "images/hero_image.jpeg" %}') center center / cover
            no-repeat;
      }

      .section_banner {
        width: 100%; /* Adjust width as needed */
        padding-top: 150px;
        padding-bottom: 150px;
        min-height: 500px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.9), rgba(15, 25, 52, 0.9)),
          url('{% static "images/section_banner.jpg" %}') center center / cover
            no-repeat;
      }

      .us_image {
        width: 100%; /* Adjust width as needed */
        min-height: 500px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.68), rgba(15, 25, 52, 0.669)),
          url('{% static "images/us_image.jpg" %}') center center / cover
            no-repeat;
      }

      .page_banner {
        width: 100%; /* Adjust width as needed */
        min-height: 300px;
        margin-bottom: 100px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.58), rgba(15, 25, 52, 0.537)),
          url('{% static "images/offtrack_image01.jpg" %}') center center /
            cover no-repeat;
      }

      .service_page_banner {
        width: 100%; /* Adjust width as needed */
        min-height: 300px;
        margin-bottom: 100px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.58), rgba(15, 25, 52, 0.537)),
          url('{% static "images/offtrack_image03.jpg" %}') center center /
            cover no-repeat;
      }

      .service_page_background {
        width: 100%; /* Adjust width as needed */
        min-height: 300px;
        margin-bottom: 100px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.58), rgba(15, 25, 52, 0.537)),
          url('{% static "images/service_page_background_image.png" %}') center
            center / cover no-repeat;
      }

      .contract_page_banner {
        width: 100%; /* Adjust width as needed */
        min-height: 300px;
        margin-bottom: 100px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.58), rgba(15, 25, 52, 0.537)),
          url('{% static "images/offtrack_image02.jpg" %}') center center /
            cover no-repeat;
      }

      .us_orange_container {
        width: 100%; /* Adjust width as needed */
        min-height: 250px;
        background:
          linear-gradient(
            to top right,
            rgba(245, 91, 20, 0.994),
            /* darker bottom-left */ rgba(245, 91, 20, 0.808)
              /* lighter top-right (image visible) */
          ),
          url('{% static "images/us_banner_image.png" %}') center center / cover
            no-repeat;
      }

      .footer_container {
        width: 100%; /* Adjust width as needed */
        padding-top: 150px;
        padding-bottom: 150px;
        min-height: 500px;
        background:
          linear-gradient(rgba(15, 25, 52, 0.925), rgba(15, 25, 52, 0.935)),
          url('{% static "images/footer_image.jpg" %}') center center / cover
            no-repeat;
      }

      @media screen and (max-width: 576px) {
        .hero_container {
          padding-top: 70px;
          padding-bottom: 70px;
        }

        .section_banner {
          min-height: 300px;
        }

        .footer_container {
          padding-top: 70px;
          padding-bottom: 70px;
        }

        .page_banner {
          min-height: 100px;
          padding-top: 100px;
          margin-bottom: 100px;
        }

        .service_page_banner {
          min-height: 100px;
          padding-top: 100px;
          margin-bottom: 100px;
        }

        .contract_page_banner {
          min-height: 100px;
          padding-top: 100px;
          margin-bottom: 100px;
        }
      }
    </style>

    <title>OFFTRACK MINING</title>
  </head>
  <body>
    {% if show_navbar is not False %}
    <!-- ======= Navbar  ======= -->
    {% include 'partials/navbar.html' %}
    <!-- ======= Navbar  ======= -->
    {% endif %}

    <div class="content" id="content">{% include page %}</div>

    {% if show_footer is not False %}
    <!-- ======= Footer  ======= -->
    {% include 'partials/footer.html' %}
    <!-- ======= Footer  ======= -->
    {% endif %}

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>

    <script>
      window.addEventListener("load", function () {
        const spinner = document.getElementById("loading-spinner");
        spinner.style.display = "none";
      });
    </script>

    <script>
      document.body.addEventListener("htmx:afterSwap", function (evt) {
        if (evt.detail.target.id === "content") {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    </script>

    <!-- Animation Scripts start  -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <!-- Animation Scripts end  -->

    
  </body>
</html>
