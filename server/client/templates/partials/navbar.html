{% load static %}

<nav

      <img

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a

            hx-get="{% url 'index' %}"
            hx-target="#content"
            hx-push-url="true"

        </li>
        <li class="nav-item">
          <a

        <li class="nav-item">

        <li class="nav-item">
          <a
            class="nav-link"
            href="{% url 'services' %}"
            hx-get="{% url 'services' %}"
            hx-target="#content"
            hx-push-url="true"
            >Services</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            href="{% url 'contract' %}"
            hx-get="{% url 'contract' %}"
            hx-target="#content"
            hx-push-url="true"
            >Contact</a
          >
        </li>
      </ul>

      <div class="d-flex">
        <a
          href="{% url 'contract' %}"
          hx-get="{% url 'contract' %}"
          hx-target="#content"
          hx-push-url="true"
        >
          <button
            class="btn btn-dark orange_secondary_btn d-flex justify-content-center gap-3 fw-bold px-4 py-3"
          >
            Get Support <i class="bi bi-arrow-right"></i>
          </button>
        </a>
      </div>
